services:
  - type: web
    name: portfolio-agent
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      # Secrets — set these manually in the Render dashboard (Environment tab),
      # not here. `sync: false` tells Render to prompt for a value rather than
      # storing one in this file.
      - key: GOOGLE_API_KEY
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      # Optional — only needed if you want LangSmith tracing on the deployed
      # app. Leave both blank in the dashboard to skip tracing entirely;
      # frontend/app.py also force-disables tracing in code whenever
      # LANGCHAIN_API_KEY is absent, so a stray "true" here can't cause
      # LangSmith 401s on its own the way it previously did.
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_TRACING_V2
        sync: false
      - key: LANGCHAIN_PROJECT
        value: portfolio-agent
